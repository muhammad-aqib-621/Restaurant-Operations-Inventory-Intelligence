# TLS terminates at the trusted outer reverse proxy. Keep this service private.
map $http_upgrade $nk_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The outer proxy must replace this header and be the only way to reach nginx.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nk_connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 75s;
    proxy_buffering off;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control 'no-cache';
  }
}
